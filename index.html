<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Board</title>

<link href="./output.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>

.hover-over{
    border:2px solid #d3cbcba4;
    scale:1.02;
}

.modal{
    position:fixed;
    height:100vh;
    width:100vw;
    top:0;
    left:0;
    display:none;
    align-items:center;
    justify-content:center;
}

.modal.active{
    display:flex;
}

section .task-col .task{
    background:#2a2a2a;
    margin:0 8px;
    padding:8px 16px;
    border-radius:8px;
    display:flex;
    flex-direction:column;
    gap:8px;
    cursor:grab;
}

section .task-col .task button{
    padding:4px 8px;
    align-self:flex-end;
    background-color:red;
    border-radius:8px;
    font-size:12px;
}

</style>
</head>


<body class="h-screen w-full bg-[#0c0c0c] text-white font-system-ui">

<main class="h-full flex flex-col">

<nav class="py-4 px-8 flex items-center justify-between">

<div>
Kanban Board
</div>

<button
id="toggle-modal"
class="bg-[#1a1a1a] px-4 py-2 rounded border-none outline-none">

Add New Task

</button>

</nav>



<section
class="board py-3.75 px-7.5 flex justify-between gap-7.5 flex-1">


<div
id="to-do"
class="task-col bg-[#1a1a1a] flex flex-col grow h-full gap-3.75 transition-all duration-700 ease-[cubic-bezier(0.19,1,0.22,1)]">

<div class="heading flex justify-between px-4 py-2 border-b border-[#333]">

<div>To do</div>

<div class="right">0</div>

</div>

</div>



<div
id="in-progress"
class="task-col bg-[#1a1a1a] flex flex-col grow h-full gap-3.75 transition-all duration-700 ease-[cubic-bezier(0.19,1,0.22,1)]">

<div class="heading flex justify-between px-4 py-2 border-b border-[#333]">

<div>In progress</div>

<div class="right">0</div>

</div>

</div>



<div
id="done"
class="task-col bg-[#1a1a1a] flex flex-col grow h-full gap-3.75 transition-all duration-700 ease-[cubic-bezier(0.19,1,0.22,1)]">

<div class="heading flex justify-between px-4 py-2 border-b border-[#333]">

<div>Done</div>

<div class="right">0</div>

</div>

</div>


</section>

</main>



<div class="modal">

<div
class="bg absolute h-full w-full bg-[rgba(61,61,61,0.404)] backdrop-blur-sm">

</div>

<div
class="center bg-[#03010165] py-10 px-12 rounded-xl flex flex-col gap-4 z-10">

<input
type="text"
placeholder="Task Title"
class="bg-[#0c0c0d] rounded-lg p-2"
id="task-title">

<textarea
placeholder="Task Description"
class="bg-[#0c0c0d] rounded-lg p-2"
id="task-area"></textarea>

<button
id="add-task"
class="text-white bg-cyan-950 px-3 py-2 rounded-lg w-fit self-center">

Add Task

</button>

</div>

</div>


<script defer src="./script.js"></script>

</body>
</html>
